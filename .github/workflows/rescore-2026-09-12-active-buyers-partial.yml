name: rescore-2026-09-12-active-buyers-partial
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/rescore-2026-09-12-active-buyers-partial.yml"
  workflow_dispatch:
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict rescore at Sep12 cutoff
        working-directory: sol-alpha-wallet-discovery
        run: python history_rescore.py --candidates active_alpha_buyers_2026_09_13_partial.json --cutoff-date 2026-09-13 --shard 0 --shards 1 --pages 5 --out out/2026-09-12/active_rescore_0.json
      - uses: actions/upload-artifact@v4
        with:
          name: sep12-active-rescore-0
          path: sol-alpha-wallet-discovery/out/2026-09-12/active_rescore_0.json
          if-no-files-found: error
