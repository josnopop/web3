name: sol-alpha-wallet-discovery-ci

on:
  pull_request:
    paths:
      - "sol-alpha-wallet-discovery/**/*.py"
      - "sol-alpha-wallet-discovery/tests/**"
      - "sol-alpha-wallet-discovery/requirements.txt"
      - ".github/workflows/sol-alpha-wallet-discovery-ci.yml"
  workflow_dispatch:

concurrency:
  group: sol-alpha-wallet-discovery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sol-alpha-wallet-discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall config.py scoring.py bigquery_scan.py
      - run: python -m unittest discover -s tests -v
