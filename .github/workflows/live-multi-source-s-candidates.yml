name: live-multi-source-s-candidates
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/live-multi-source-s-candidates.yml"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
      OKX_PROJECT_ID: ${{ secrets.OKX_PROJECT_ID }}
      SOLANATRACKER_API_KEY: ${{ secrets.SOLANATRACKER_API_KEY }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
      CIELO_API_KEY: ${{ secrets.CIELO_API_KEY }}
      ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      DUNE_QUERY_IDS: ${{ secrets.DUNE_QUERY_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GMGN CLI if available
        run: npm install -g gmgn-cli || true
      - name: Run all available discovery adapters
        working-directory: sol-alpha-wallet-discovery
        run: |
          python multi_source_discovery.py \
            --mints-file historical_priority_mints_50.json \
            --out out/live/multi_source_candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-multi-source-candidates
          path: sol-alpha-wallet-discovery/out/live/multi_source_candidates.json
          if-no-files-found: error
