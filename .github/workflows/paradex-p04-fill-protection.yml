name: Paradex P04 Fill Protection And Close

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned official Paradex SDK
        run: python -m pip install --disable-pip-version-check "paradex-py==0.7.0"
      - name: Deterministic two-account fill protection and close
        shell: bash
        env:
          PARADEX_ENVIRONMENT: nightly
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import time
          from decimal import Decimal, ROUND_DOWN

          from paradex_py import Paradex
          from paradex_py.common.order import Order, OrderSide, OrderType
          from paradex_py.environment import NIGHTLY
          from starknet_py.constants import EC_ORDER

          MARKET = "BTC-USD-PERP"
          SIZE = Decimal("0.001")

          if os.environ.get("PARADEX_L1_PRIVATE_KEY") or os.environ.get("PARADEX_L2_PRIVATE_KEY"):
              raise RuntimeError("P04 refuses externally supplied private keys")

          def new_client():
              private_key = secrets.randbelow(EC_ORDER - 1) + 1
              client = Paradex(
                  env=NIGHTLY,
                  l1_address="0x" + secrets.token_hex(20),
                  l2_private_key=hex(private_key),
                  server_derive_address=True,
                  ws_url_override="wss://ws.api.nightly.paradex.trade/v1",
              )
              private_key = None
              return client

          maker = new_client()
          taker = new_client()

          def wait_funds(client):
              deadline = time.monotonic() + 600
              while time.monotonic() < deadline:
                  balances = client.api_client.fetch_balances()
                  usdc = next((float(row.get("size", 0)) for row in balances.get("results", []) if row.get("token") == "USDC"), 0.0)
                  if usdc >= 10:
                      return True
                  time.sleep(10)
              return False

          if not wait_funds(maker) or not wait_funds(taker):
              raise RuntimeError("nightly faucet did not fund both test accounts")

          def pos(client):
              response = client.api_client.fetch_positions()
              for row in response.get("results", []):
                  if row.get("market") == MARKET:
                      return Decimal(str(row.get("size", "0")))
              return Decimal("0")

          def wait_positions(predicate, timeout=30):
              deadline = time.monotonic() + timeout
              values = (pos(maker), pos(taker))
              while time.monotonic() < deadline:
                  values = (pos(maker), pos(taker))
                  if predicate(*values):
                      return values
                  time.sleep(0.5)
              return values

          def submit(client, order):
              response = client.api_client.submit_order(order)
              oid = response.get("id")
              if not oid:
                  raise RuntimeError("submit response missing id")
              return oid

          def wait_order_open(client, order_id, timeout=15):
              deadline = time.monotonic() + timeout
              state = "UNKNOWN"
              while time.monotonic() < deadline:
                  order = client.api_client.fetch_order(order_id=order_id)
                  state = str(order.get("status", "UNKNOWN"))
                  if state == "OPEN":
                      return True, state
                  if state == "CLOSED":
                      return False, state
                  time.sleep(0.25)
              return False, state

          def mark_price():
              response = maker.api_client.fetch_markets_summary({"market": MARKET})
              rows = response.get("results", [])
              if not rows:
                  raise RuntimeError("market summary unavailable")
              value = Decimal(str(rows[0].get("mark_price") or rows[0].get("underlying_price") or "0"))
              if value <= 0:
                  raise RuntimeError("invalid mark price")
              return value

          def is_reduce_only(order):
              flags = order.get("flags") or []
              return bool(order.get("reduce_only")) or "REDUCE_ONLY" in flags

          protection_ids = []
          entry_filled = False
          protection_verified = False
          reduce_only_close_verified = False
          cleanup_errors = []

          try:
              mark = mark_price()
              entry_price = (mark * Decimal("1.02")).quantize(Decimal("1"), rounding=ROUND_DOWN)

              maker_order_id = submit(maker, Order(
                  market=MARKET,
                  order_type=OrderType.Limit,
                  order_side=OrderSide.Sell,
                  size=SIZE,
                  limit_price=entry_price,
                  client_id="p04_maker_" + secrets.token_hex(6),
                  instruction="POST_ONLY",
                  reduce_only=False,
              ))
              maker_open, maker_state = wait_order_open(maker, maker_order_id)
              if not maker_open:
                  raise RuntimeError("entry maker order not OPEN: " + maker_state)
              taker_order_id = submit(taker, Order(
                  market=MARKET,
                  order_type=OrderType.Limit,
                  order_side=OrderSide.Buy,
                  size=SIZE,
                  limit_price=entry_price,
                  client_id="p04_entry_" + secrets.token_hex(6),
                  instruction="GTC",
                  reduce_only=False,
              ))
              maker_size, taker_size = wait_positions(lambda a, b: b > 0)
              entry_filled = taker_size > 0
              if entry_filled:
                  try:
                      maker.api_client.cancel_order(maker_order_id)
                  except Exception:
                      pass
              if not entry_filled:
                  maker_state = maker.api_client.fetch_order(order_id=maker_order_id)
                  taker_state = taker.api_client.fetch_order(order_id=taker_order_id)
                  maker_fills = maker.api_client.fetch_fills({"market": MARKET}).get("results", [])
                  taker_fills = taker.api_client.fetch_fills({"market": MARKET}).get("results", [])
                  diagnostic = {
                      "maker_status": maker_state.get("status"),
                      "maker_cancel_reason": maker_state.get("cancel_reason"),
                      "maker_remaining_size": maker_state.get("remaining_size"),
                      "taker_status": taker_state.get("status"),
                      "taker_cancel_reason": taker_state.get("cancel_reason"),
                      "taker_remaining_size": taker_state.get("remaining_size"),
                      "maker_fills": len(maker_fills),
                      "taker_fills": len(taker_fills),
                  }
                  print("P04_MATCH_DIAGNOSTIC=" + json.dumps(diagnostic, sort_keys=True), flush=True)
                  raise RuntimeError("two-account entry did not fill")

              stop_id = submit(taker, Order(
                  market=MARKET,
                  order_type=OrderType.StopLossMarket,
                  order_side=OrderSide.Sell,
                  size=taker_size,
                  trigger_price=(mark * Decimal("0.98")).quantize(Decimal("1"), rounding=ROUND_DOWN),
                  client_id="p04_sl_" + secrets.token_hex(6),
                  reduce_only=True,
              ))
              take_id = submit(taker, Order(
                  market=MARKET,
                  order_type=OrderType.TakeProfitMarket,
                  order_side=OrderSide.Sell,
                  size=taker_size,
                  trigger_price=(mark * Decimal("1.02")).quantize(Decimal("1"), rounding=ROUND_DOWN),
                  client_id="p04_tp_" + secrets.token_hex(6),
                  reduce_only=True,
              ))
              protection_ids = [stop_id, take_id]
              stop_state = taker.api_client.fetch_order(order_id=stop_id)
              take_state = taker.api_client.fetch_order(order_id=take_id)
              protection_verified = (
                  stop_state.get("id") == stop_id
                  and take_state.get("id") == take_id
                  and is_reduce_only(stop_state)
                  and is_reduce_only(take_state)
              )
              if not protection_verified:
                  raise RuntimeError("native protection verification failed")

              for oid in protection_ids:
                  taker.api_client.cancel_order(oid)
              protection_ids = []

              close_price = (mark * Decimal("0.98")).quantize(Decimal("1"), rounding=ROUND_DOWN)
              submit(taker, Order(
                  market=MARKET,
                  order_type=OrderType.Limit,
                  order_side=OrderSide.Sell,
                  size=taker_size,
                  limit_price=close_price,
                  client_id="p04_close_taker_" + secrets.token_hex(6),
                  instruction="GTC",
                  reduce_only=True,
              ))
              final_maker, final_taker = wait_positions(lambda a, b: a == 0 and b == 0)
              reduce_only_close_verified = final_maker == 0 and final_taker == 0
              if not reduce_only_close_verified:
                  raise RuntimeError("paired reduce-only close did not flatten both accounts")
          finally:
              for client in (maker, taker):
                  try:
                      client.api_client.cancel_all_orders({"market": MARKET})
                  except Exception as exc:
                      cleanup_errors.append(type(exc).__name__)
              final_maker, final_taker = pos(maker), pos(taker)

          result = {
              "environment": "PARADEX_NIGHTLY_SANDBOX",
              "market": MARKET,
              "size": str(SIZE),
              "two_account_self_match": True,
              "entry_filled": entry_filled,
              "native_stop_loss_verified": protection_verified,
              "native_take_profit_verified": protection_verified,
              "reduce_only_close_verified": reduce_only_close_verified,
              "final_maker_position": str(final_maker),
              "final_taker_position": str(final_taker),
              "cleanup_errors": cleanup_errors,
              "ephemeral_wallets": 2,
              "private_keys_logged": False,
              "private_keys_persisted": False,
              "real_funds_used": False,
          }
          print("P04_RESULT=" + json.dumps(result, sort_keys=True))
          if (
              not entry_filled
              or not protection_verified
              or not reduce_only_close_verified
              or final_maker != 0
              or final_taker != 0
              or cleanup_errors
          ):
              raise SystemExit("P04 acceptance failed")
          PY
