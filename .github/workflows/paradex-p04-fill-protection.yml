name: Paradex P04 Fill Protection And Close

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p04:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned official Paradex SDK
        run: python -m pip install --disable-pip-version-check "paradex-py==0.7.0"
      - name: Minimal fill native protection and reduce-only close
        shell: bash
        env:
          PARADEX_ENVIRONMENT: nightly
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import time
          from decimal import Decimal, ROUND_DOWN, ROUND_UP

          from paradex_py import Paradex
          from paradex_py.common.order import Order, OrderSide, OrderType
          from paradex_py.environment import NIGHTLY
          from starknet_py.constants import EC_ORDER

          MARKET = "BTC-USD-PERP"
          SIZE = Decimal("0.001")

          if os.environ.get("PARADEX_L1_PRIVATE_KEY") or os.environ.get("PARADEX_L2_PRIVATE_KEY"):
              raise RuntimeError("P04 refuses externally supplied private keys")

          private_key = secrets.randbelow(EC_ORDER - 1) + 1
          client = Paradex(
              env=NIGHTLY,
              l1_address="0x" + secrets.token_hex(20),
              l2_private_key=hex(private_key),
              server_derive_address=True,
              ws_url_override="wss://ws.api.nightly.paradex.trade/v1",
          )
          private_key = None

          def position_size():
              response = client.api_client.fetch_positions()
              for row in response.get("results", []):
                  if row.get("market") == MARKET:
                      return Decimal(str(row.get("size", "0")))
              return Decimal("0")

          def wait_position(predicate, timeout=30):
              deadline = time.monotonic() + timeout
              last = Decimal("0")
              while time.monotonic() < deadline:
                  last = position_size()
                  if predicate(last):
                      return last
                  time.sleep(0.5)
              return last

          def submit(order):
              response = client.api_client.submit_order(order)
              oid = response.get("id")
              if not oid:
                  raise RuntimeError("submit response missing id")
              return oid

          deadline = time.monotonic() + 600
          funded = False
          while time.monotonic() < deadline:
              balances = client.api_client.fetch_balances()
              usdc = next((float(row.get("size", 0)) for row in balances.get("results", []) if row.get("token") == "USDC"), 0.0)
              if usdc >= 10:
                  funded = True
                  break
              time.sleep(10)
          if not funded:
              raise RuntimeError("nightly faucet did not provide test USDC")

          entry_id = None
          stop_id = None
          take_id = None
          close_id = None
          entry_filled = False
          protection_verified = False
          flat_verified = False
          cleanup_errors = []

          try:
              bbo = client.api_client.fetch_bbo(MARKET)
              ask = Decimal(str(bbo.get("ask_price") or bbo.get("ask") or "0"))
              bid = Decimal(str(bbo.get("bid_price") or bbo.get("bid") or "0"))
              if ask <= 0 or bid <= 0:
                  raise RuntimeError("invalid BBO")

              entry_limit = (ask * Decimal("1.02")).quantize(Decimal("1"), rounding=ROUND_UP)
              entry_id = submit(Order(
                  market=MARKET,
                  order_type=OrderType.Limit,
                  order_side=OrderSide.Buy,
                  size=SIZE,
                  limit_price=entry_limit,
                  client_id="p04_entry_" + secrets.token_hex(6),
                  instruction="IOC",
                  reduce_only=False,
              ))
              opened_size = wait_position(lambda value: value > 0)
              entry_filled = opened_size > 0
              if not entry_filled:
                  raise RuntimeError("entry IOC produced no long position")

              stop_trigger = (ask * Decimal("0.98")).quantize(Decimal("1"), rounding=ROUND_DOWN)
              take_trigger = (ask * Decimal("1.02")).quantize(Decimal("1"), rounding=ROUND_UP)
              stop_id = submit(Order(
                  market=MARKET,
                  order_type=OrderType.StopLossMarket,
                  order_side=OrderSide.Sell,
                  size=opened_size,
                  trigger_price=stop_trigger,
                  client_id="p04_sl_" + secrets.token_hex(6),
                  reduce_only=True,
              ))
              take_id = submit(Order(
                  market=MARKET,
                  order_type=OrderType.TakeProfitMarket,
                  order_side=OrderSide.Sell,
                  size=opened_size,
                  trigger_price=take_trigger,
                  client_id="p04_tp_" + secrets.token_hex(6),
                  reduce_only=True,
              ))
              stop_state = client.api_client.fetch_order(order_id=stop_id)
              take_state = client.api_client.fetch_order(order_id=take_id)
              protection_verified = (
                  stop_state.get("id") == stop_id
                  and take_state.get("id") == take_id
                  and bool(stop_state.get("reduce_only"))
                  and bool(take_state.get("reduce_only"))
              )
              if not protection_verified:
                  raise RuntimeError("native protection verification failed")

              fresh = client.api_client.fetch_bbo(MARKET)
              close_bid = Decimal(str(fresh.get("bid_price") or fresh.get("bid") or "0"))
              close_limit = (close_bid * Decimal("0.98")).quantize(Decimal("1"), rounding=ROUND_DOWN)
              close_id = submit(Order(
                  market=MARKET,
                  order_type=OrderType.Limit,
                  order_side=OrderSide.Sell,
                  size=opened_size,
                  limit_price=close_limit,
                  client_id="p04_close_" + secrets.token_hex(6),
                  instruction="IOC",
                  reduce_only=True,
              ))
              remaining = wait_position(lambda value: value == 0)
              flat_verified = remaining == 0
              if not flat_verified:
                  raise RuntimeError("reduce-only close did not flatten position")
          finally:
              try:
                  client.api_client.cancel_all_orders({"market": MARKET})
              except Exception as exc:
                  cleanup_errors.append(type(exc).__name__)
              remaining = position_size()
              if remaining > 0:
                  try:
                      fresh = client.api_client.fetch_bbo(MARKET)
                      close_bid = Decimal(str(fresh.get("bid_price") or fresh.get("bid") or "0"))
                      emergency_limit = (close_bid * Decimal("0.95")).quantize(Decimal("1"), rounding=ROUND_DOWN)
                      submit(Order(
                          market=MARKET,
                          order_type=OrderType.Limit,
                          order_side=OrderSide.Sell,
                          size=remaining,
                          limit_price=emergency_limit,
                          client_id="p04_cleanup_" + secrets.token_hex(6),
                          instruction="IOC",
                          reduce_only=True,
                      ))
                      remaining = wait_position(lambda value: value == 0)
                  except Exception as exc:
                      cleanup_errors.append(type(exc).__name__)
              final_size = position_size()
              flat_verified = final_size == 0

          result = {
              "environment": "PARADEX_NIGHTLY_SANDBOX",
              "market": MARKET,
              "size": str(SIZE),
              "entry_filled": entry_filled,
              "native_stop_loss_verified": protection_verified,
              "native_take_profit_verified": protection_verified,
              "reduce_only_close_verified": flat_verified,
              "final_position_size": str(final_size),
              "cleanup_errors": cleanup_errors,
              "ephemeral_wallet": True,
              "private_key_logged": False,
              "private_key_persisted": False,
              "real_funds_used": False,
          }
          print("P04_RESULT=" + json.dumps(result, sort_keys=True))
          if not entry_filled or not protection_verified or not flat_verified or cleanup_errors:
              raise SystemExit("P04 acceptance failed")
          PY
