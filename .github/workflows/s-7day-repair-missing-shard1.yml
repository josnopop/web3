name: s-7day-repair-missing-shard1
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s-7day-repair-missing-shard1.yml"
  workflow_dispatch:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        day: ["2026-09-13","2026-09-15","2026-09-16"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay missing shard 1
        working-directory: sol-alpha-wallet-discovery
        run: |
          mkdir -p out/repair
          python s_day_replay_fast.py \
            --pool s_simple12_2026_09_19.json \
            --date "${{ matrix.day }}" \
            --shard 1 --shards 4 --pages 4 --batch-size 20 \
            --out "out/repair/shard_1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-${{ matrix.day }}-shard1
          path: sol-alpha-wallet-discovery/out/repair/shard_1.json
          if-no-files-found: error
