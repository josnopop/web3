name: s-historical-elite-v2
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s-historical-elite-v2.yml"
      - "sol-alpha-wallet-discovery/s_historical_elite_2026_09_19.json"
      - "sol-alpha-wallet-discovery/s_fast15_filter.py"
      - "sol-alpha-wallet-discovery/history_rescore.py"
      - "sol-alpha-wallet-discovery/build_wallet_history_cache.py"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate elite candidate over 15d
        working-directory: sol-alpha-wallet-discovery
        run: |
          python build_wallet_history_cache.py \
            --candidates s_historical_elite_2026_09_19.json \
            --start-date 2026-09-04 --end-date 2026-09-19 \
            --shard ${{ matrix.shard }} --shards 8 --pages 12 \
            --out out/s_elite/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: s-elite-${{ matrix.shard }}
          path: sol-alpha-wallet-discovery/out/s_elite/shard_${{ matrix.shard }}.json
          if-no-files-found: error

  qualify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: s-elite-*
          path: sol-alpha-wallet-discovery/out/s_elite
          merge-multiple: true
      - name: 7d freshness + 15d S qualification
        working-directory: sol-alpha-wallet-discovery
        run: |
          python s_fast15_filter.py \
            --cache out/s_elite \
            --cutoff-date 2026-09-19 \
            --out out/s_elite/S_WALLETS_FAST15.json
      - uses: actions/upload-artifact@v4
        with:
          name: S-HISTORICAL-ELITE-FAST15
          path: sol-alpha-wallet-discovery/out/s_elite/
          if-no-files-found: error
