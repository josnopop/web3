name: rescore-2026-09-14-active-buyers-partial
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/rescore-2026-09-14-active-buyers-partial.yml"
  workflow_dispatch:
jobs:
  rescore:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict rescore at Sep14 cutoff
        working-directory: sol-alpha-wallet-discovery
        run: python history_rescore.py --candidates active_alpha_buyers_2026_09_15_partial.json --cutoff-date 2026-09-15 --shard ${{ matrix.shard }} --shards 9 --pages 5 --out out/2026-09-14/active_rescore_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sep14-active-rescore-${{ matrix.shard }}
          path: sol-alpha-wallet-discovery/out/2026-09-14/active_rescore_*.json
          if-no-files-found: error
