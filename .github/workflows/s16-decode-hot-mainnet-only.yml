name: s16-decode-hot-mainnet-only
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s16-decode-hot-mainnet-only.yml"
  workflow_dispatch:
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [4,9]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLANA_RPC_URL: https://api.mainnet.solana.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode Sep16 hot wallet using mainnet only
        working-directory: sol-alpha-wallet-discovery
        run: |
          mkdir -p out/s16_mainnet_hot
          python s_day_replay_fast.py \
            --pool s_simple12_2026_09_19.json \
            --date 2026-09-16 \
            --shard ${{ matrix.shard }} --shards 12 --pages 4 --batch-size 20 \
            --out out/s16_mainnet_hot/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: s16-mainnet-hot-${{ matrix.shard }}
          path: sol-alpha-wallet-discovery/out/s16_mainnet_hot/shard_${{ matrix.shard }}.json
          if-no-files-found: error
