name: s-day-sim-2026-09-18
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s-day-sim-2026-09-18.yml"
  workflow_dispatch:

concurrency:
  group: s-day-sim-2026-09-18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Replay 12 S wallets over one 24h day
        working-directory: sol-alpha-wallet-discovery
        run: |
          mkdir -p out/s_day_0918/replays
          python s_day_replay.py --pool s_simple12_2026_09_19.json --date 2026-09-18 --shard 0 --shards 4 --pages 4 --out out/s_day_0918/replays/shard_0.json &
          p0=$!
          python s_day_replay.py --pool s_simple12_2026_09_19.json --date 2026-09-18 --shard 1 --shards 4 --pages 4 --out out/s_day_0918/replays/shard_1.json &
          p1=$!
          python s_day_replay.py --pool s_simple12_2026_09_19.json --date 2026-09-18 --shard 2 --shards 4 --pages 4 --out out/s_day_0918/replays/shard_2.json &
          p2=$!
          python s_day_replay.py --pool s_simple12_2026_09_19.json --date 2026-09-18 --shard 3 --shards 4 --pages 4 --out out/s_day_0918/replays/shard_3.json &
          p3=$!
          wait $p0 $p1 $p2 $p3

      - name: Run S-wallet follow algorithm
        working-directory: sol-alpha-wallet-discovery
        run: |
          python s_day_simulate.py \
            --replays out/s_day_0918/replays \
            --probe-sol 0.03 \
            --buy-sol 0.10 \
            --confirm-seconds 600 \
            --roundtrip-friction 0.015 \
            --out out/s_day_0918/S_DAY_RESULT.json
          cat out/s_day_0918/S_DAY_RESULT.json

      - uses: actions/upload-artifact@v4
        with:
          name: S-DAY-SIM-2026-09-18
          path: sol-alpha-wallet-discovery/out/s_day_0918/
          if-no-files-found: error
