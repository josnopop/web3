name: recover-2026-09-16-wallet-transactions

on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - "sol-alpha-wallet-discovery/frozen_wallets_2026_09_15.json"
      - "sol-alpha-wallet-discovery/recover_day_signatures.py"
      - ".github/workflows/recover-wallet-day.yml"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover exact Sep-16 signatures for frozen pool
        working-directory: sol-alpha-wallet-discovery
        run: python recover_day_signatures.py --date 2026-09-16 --pages 10
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-signatures-2026-09-16
          path: sol-alpha-wallet-discovery/out/2026-09-16/wallet_signatures.json
          if-no-files-found: error
