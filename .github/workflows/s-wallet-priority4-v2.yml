name: s-wallet-priority4-v2
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s-wallet-priority4-v2.yml"
      - "sol-alpha-wallet-discovery/s_priority4_2026_09_19.json"
      - "sol-alpha-wallet-discovery/history_rescore.py"
      - "sol-alpha-wallet-discovery/build_wallet_history_cache.py"
      - "sol-alpha-wallet-discovery/s_fast7_filter.py"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate one priority S candidate over 7d
        working-directory: sol-alpha-wallet-discovery
        run: |
          python build_wallet_history_cache.py \
            --candidates s_priority4_2026_09_19.json \
            --start-date 2026-09-12 --end-date 2026-09-19 \
            --shard ${{ matrix.shard }} --shards 4 --pages 8 \
            --out out/s_priority4/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: s-priority4-${{ matrix.shard }}
          path: sol-alpha-wallet-discovery/out/s_priority4/shard_${{ matrix.shard }}.json
          if-no-files-found: error

  qualify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: s-priority4-*
          path: sol-alpha-wallet-discovery/out/s_priority4
          merge-multiple: true
      - name: 7d freshness + 7d S qualification
        working-directory: sol-alpha-wallet-discovery
        run: |
          python s_fast7_filter.py \
            --cache out/s_priority4 \
            --cutoff-date 2026-09-19 \
            --out out/s_priority4/S_WALLETS_FAST7.json
      - uses: actions/upload-artifact@v4
        with:
          name: S-PRIORITY4-FAST7
          path: sol-alpha-wallet-discovery/out/s_priority4/
          if-no-files-found: error
