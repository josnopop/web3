name: s16-s10-partition-batch
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s16-s10-partition-batch.yml"
      - "sol-alpha-wallet-discovery/s16_s10_partition_batch.py"
  workflow_dispatch:
jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Batch decode partition
        working-directory: sol-alpha-wallet-discovery
        run: |
          mkdir -p out/s16_s10_batch
          python s16_s10_partition_batch.py --part ${{ matrix.part }} --parts 6 --out out/s16_s10_batch/part_${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: s16-s10-batch-${{ matrix.part }}
          path: sol-alpha-wallet-discovery/out/s16_s10_batch/part_${{ matrix.part }}.json
          if-no-files-found: error
