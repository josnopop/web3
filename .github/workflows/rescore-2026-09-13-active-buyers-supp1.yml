name: rescore-2026-09-13-active-buyers-supp1
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/rescore-2026-09-13-active-buyers-supp1.yml"
  workflow_dispatch:
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Strict rescore 6SAze at Sep13 cutoff
        working-directory: sol-alpha-wallet-discovery
        run: python history_rescore.py --candidates active_alpha_buyers_2026_09_14_supp1.json --cutoff-date 2026-09-14 --shard 0 --shards 1 --pages 5 --out out/2026-09-13/supp1_rescore_0.json
      - uses: actions/upload-artifact@v4
        with:
          name: sep13-supp1-rescore-0
          path: sol-alpha-wallet-discovery/out/2026-09-13/supp1_rescore_0.json
          if-no-files-found: error
