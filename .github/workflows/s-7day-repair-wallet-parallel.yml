name: s-7day-repair-wallet-parallel
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - ".github/workflows/s-7day-repair-wallet-parallel.yml"
  workflow_dispatch:
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {day: "2026-09-15", shard: 1}
          - {day: "2026-09-15", shard: 5}
          - {day: "2026-09-15", shard: 9}
          - {day: "2026-09-16", shard: 1}
          - {day: "2026-09-16", shard: 5}
          - {day: "2026-09-16", shard: 9}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Replay one wallet
        working-directory: sol-alpha-wallet-discovery
        run: |
          mkdir -p out/repair-wallet
          python s_day_replay_fast.py \
            --pool s_simple12_2026_09_19.json \
            --date "${{ matrix.day }}" \
            --shard ${{ matrix.shard }} --shards 12 --pages 1 --batch-size 20 \
            --out "out/repair-wallet/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-wallet-${{ matrix.day }}-${{ matrix.shard }}
          path: sol-alpha-wallet-discovery/out/repair-wallet/result.json
          if-no-files-found: error
