name: wallet-discovery-tests

on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - "sol-alpha-wallet-discovery/**"
      - ".github/workflows/wallet-discovery-tests.yml"
  pull_request:
    paths:
      - "sol-alpha-wallet-discovery/**"
      - ".github/workflows/wallet-discovery-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        working-directory: sol-alpha-wallet-discovery
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        working-directory: sol-alpha-wallet-discovery
        run: python -m py_compile config.py scoring.py source_bridge.py bigquery_scan.py
