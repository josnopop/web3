name: audit-wallet-discovery-v04
on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - "sol-alpha-wallet-discovery/collect_alpha_candidates.py"
      - ".github/workflows/audit-wallet-discovery-v04.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cutoff:
          - "2026-09-13T16:00:00Z"
          - "2026-09-12T16:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Broad discovery scan
        working-directory: sol-alpha-wallet-discovery
        run: |
          d=$(echo "${{ matrix.cutoff }}" | cut -c1-10)
          python collect_alpha_candidates.py --cutoff "${{ matrix.cutoff }}" --pages 5 --limit 100 --historical-mode broad_discovery --out "out/audit_${d}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-discovery-v04-${{ matrix.cutoff }}
          path: sol-alpha-wallet-discovery/out/audit_*.json
