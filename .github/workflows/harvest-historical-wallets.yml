name: harvest-sep15-historical-wallet-candidates

on:
  push:
    branches: [feat/wallet-discovery-v03]
    paths:
      - "sol-alpha-wallet-discovery/harvest_historical_candidates.py"
      - ".github/workflows/harvest-historical-wallets.yml"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Crawl only Sep-15 historical profile snapshots
        working-directory: sol-alpha-wallet-discovery
        run: |
          python harvest_historical_candidates.py --max-profiles 150 --workers 30 --batch-size 50
      - uses: actions/upload-artifact@v4
        with:
          name: historical-wallet-candidates-2026-09-15
          path: |
            sol-alpha-wallet-discovery/out/2026-09-15/historical_candidates.json
            sol-alpha-wallet-discovery/out/2026-09-15/historical_candidates.csv
          if-no-files-found: error
