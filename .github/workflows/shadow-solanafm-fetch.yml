name: shadow-solanafm-fetch
on:
  push:
    branches: [shadow-gnbb-20260918]
    paths:
      - ".github/workflows/shadow-solanafm-fetch.yml"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SolanaFM account transfers
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse, pathlib
          wallet="GnBbV25vuKvW8z8gGyutt1JxLYnDBPnNAuWEbcAhvS84"
          base=f"https://api.solana.fm/v0/accounts/{wallet}/transfers"
          all_pages=[]
          for page in range(1,21):
              q=urllib.parse.urlencode({"utcFrom":1789660800,"utcTo":1789747200,"limit":100,"page":page})
              req=urllib.request.Request(base+"?"+q,headers={"accept":"application/json","user-agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode("utf-8","replace")
                      status=r.status
              except Exception as e:
                  print("ERR",page,type(e).__name__,str(e)[:300])
                  break
              print("PAGE",page,"HTTP",status,"BYTES",len(body))
              try: obj=json.loads(body)
              except Exception:
                  print(body[:1000]); break
              all_pages.append(obj)
              # infer empty page conservatively
              x=obj
              if isinstance(obj,dict):
                  x=obj.get("result",obj.get("data",obj))
                  if isinstance(x,dict): x=x.get("data",x.get("transfers",x))
              n=len(x) if isinstance(x,list) else None
              print("PAGE_COUNT",page,n)
              if n==0: break
              time.sleep(.25)
          pathlib.Path("solanafm_gnbb.json").write_text(json.dumps(all_pages,ensure_ascii=False,indent=2))
          print("PAGES_SAVED",len(all_pages))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solanafm-gnbb
          path: solanafm_gnbb.json
